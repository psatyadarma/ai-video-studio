<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hook test: person cut-out</title>
<link rel="stylesheet" href="../../styles/sticker/sticker.css">
<script src="../../styles/sticker/sticker.js"></script>
<script src="build/timing.js"></script>
<style>
  /* label-bar headline (stacked, condensed feel) */
  .bar { position: absolute; left: 70px; font-weight: 900; font-size: 92px; line-height: 1; letter-spacing: -2px;
         padding: 14px 26px 18px; transform-origin: 0 50%; white-space: nowrap; text-transform: uppercase; }
  .bar.ink { background: var(--ink); color: #fff; }
  .bar.hi  { background: var(--hi); color: var(--ink); }
  .bar.wh  { background: #fff; color: var(--ink); box-shadow: 0 10px 22px rgba(27,36,48,.18); }
  #person { position: absolute; left: 540px; top: 0; width: 1000px; transform-origin: 50% 100%; }
  #ledge { position: absolute; left: -400px; width: 1880px; top: 1250px; height: 900px; background: var(--paper-2);
           box-shadow: 0 -14px 30px rgba(27,36,48,.10); border-top: 6px solid #fff; }
  #person img { width: 100%; display: block; }
  .name { background: #fff; border-radius: 16px; padding: 12px 22px; font-weight: 900; font-size: 38px; line-height: 1.1;
          box-shadow: 0 0 0 7px #fff, 0 14px 24px rgba(27,36,48,.2); white-space: nowrap; }
  .name small { display: block; font-weight: 700; font-size: 26px; color: var(--slate); }
  .flag { width: 150px; height: 100px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 8px #fff, 0 14px 24px rgba(27,36,48,.22); }
  .flag .r { height: 50%; background: #EF3340; } .flag .w { height: 50%; background: #fff; }
  .credit { position: absolute; right: 190px; top: 1236px; font-weight: 700; font-size: 22px; color: var(--slate); opacity: .85; z-index: 6; }
  .smoke { position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #C3C8CE, #8C949D 70%); filter: blur(6px); opacity: .9; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <!-- smoke clouds drifting in from the left -->
    <div id="smoke" class="abs" style="left:220px; top:430px; width:10px; height:10px;"></div>
    <div id="person" class="abs"><img src="../assets/people/muhammad-lutfi.png" alt=""></div>
    <div id="sg" class="abs" style="left:900px; top:330px; display:flex; flex-direction:column; align-items:center; gap:18px;">
      <div class="flag" style="position:relative"><div class="r"></div><div class="w"></div>
        <svg style="position:absolute;left:0;top:0" width="150" height="50" viewBox="0 0 150 50"><circle cx="30" cy="25" r="16" fill="#fff"/><circle cx="37" cy="25" r="15" fill="#EF3340"/>
        <g fill="#fff"><circle cx="50" cy="16" r="3"/><circle cx="60" cy="22" r="3"/><circle cx="57" cy="33" r="3"/><circle cx="44" cy="33" r="3"/><circle cx="41" cy="22" r="3"/></g></svg></div>
      <div class="tag light sticker" style="font-size:38px; padding:10px 20px;">Singapura</div>
    </div>
    <svg id="arrow" class="abs" style="left:800px; top:500px;" width="260" height="200" viewBox="0 0 260 200">
      <path id="arrowPath" d="M20 180 C 90 160, 150 110, 200 40" fill="none" stroke="#1B2430" stroke-width="10" stroke-linecap="round" stroke-dasharray="320" stroke-dashoffset="320"/>
      <path id="arrowHead" d="M175 48 L205 34 L206 68" fill="none" stroke="#1B2430" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    </svg>
    <div id="ledge"></div>
    <div id="name" class="abs name" style="left:250px; top:700px;">Muhammad Lutfi<small>eks Menteri Perdagangan</small></div>
    <div id="stamp" class="abs stamp sticker" style="left:540px; top:860px; font-size:96px;">Rangkumin dong!</div>
  </div>

  <div id="b1" class="bar ink" style="top:850px;">Asap karhutla</div>
  <div id="b2" class="bar hi" style="top:968px;">Salah siapa?</div>
  <div id="b3" class="bar wh" style="top:1086px;">Kok bisa?</div>
  <div class="credit" id="credit">Foto: Kemendag RI (domain publik), via Wikimedia Commons</div>
  <div id="brand"><div class="dot"></div><b>Rangkumin Dong</b></div>
  <div id="subs"></div>
  <div id="progress"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const T = window.TIMING; window.DURATION = T.duration;
const at = K.at, W = K.word;

// smoke puffs (fixed layout, animated drift)
const puffs = [[-300, -40, 260], [-160, 40, 300], [-30, -90, 240], [-380, 110, 220], [80, 10, 220], [-230, -170, 210], [-60, 130, 200]];
const sm = $('smoke');
const pe = puffs.map(([x, y, r]) => { const d = document.createElement('div'); d.className = 'smoke';
  Object.assign(d.style, { left: x - r / 2 + 'px', top: y - r / 2 + 'px', width: r + 'px', height: r + 'px' }); sm.appendChild(d); return d; });

function bar(el, tIn, t) {
  const s = K.spring(t - tIn, 260, 20);
  el.style.opacity = t >= tIn ? 1 : 0;
  el.style.transform = `translateX(${(1 - s) * -60}px) scaleX(${0.6 + 0.4 * s}) rotate(${-2 + (el.id === 'b2' ? 1.5 : 0)}deg)`;
}

function seek(t) {
  K.camera($('world'), [{ t: 0, x: 540, y: 960, z: 1 }], t);
  const rd = at('rd', -0.05);
  const fade = 1 - K.clamp((t - rd) / 0.2);

  // person: rises from the bottom with a spring from frame 0 (cover works), gentle idle bob while talking about him
  const ps = K.spring(t + 0.45, 140, 15);
  const bob = t > W('h2', 'lutfi') && t < rd ? 6 * Math.sin((t - W('h2', 'lutfi')) * 9) : 0;
  const p = $('person');
  p.style.opacity = fade;
  p.style.transform = `translate(-50%, ${1420 - 1180 * ps + bob}px) scale(${0.92 + 0.08 * ps})`;
  p.style.top = '0px';

  // smoke drifts in from the left on "asap"
  const sp = K.easeOut(K.prog(t, W('h1', 'asap') - 0.15, 1.2));
  sm.style.opacity = sp * fade;
  sm.style.transform = `translate(${-420 * (1 - sp) + 20 * Math.sin(t * 0.8)}px, 0)`;
  pe.forEach((d, i) => { d.style.transform = `scale(${0.85 + 0.15 * Math.sin(t * 1.3 + i)})`; });

  // headline bars build in 3 beats
  bar($('b1'), -1, t);  // on from frame 0 so the cover carries the headline
  bar($('b2'), W('h2', 'pelaku') - 0.05, t);
  bar($('b3'), W('h2', 'kok') - 0.05, t);
  ['b1', 'b2', 'b3'].forEach((id) => { if (t >= rd) $(id).style.opacity = fade; });

  // name tag + Singapore + arrow
  K.pop($('name'), t, W('h2', 'lutfi') - 0.05, rd, -3);
  K.pop($('sg'), t, W('h2', 'singapura') - 0.05, rd, 4);
  const ap = K.prog(t, W('h2', 'singapura') + 0.05, 0.35);
  $('arrowPath').setAttribute('stroke-dashoffset', 320 * (1 - ap));
  $('arrowHead').setAttribute('opacity', ap > 0.95 && t < rd ? 1 : 0);
  $('arrow').style.opacity = t < rd ? 1 : 0;
  $('credit').style.opacity = 0.85 * fade;

  K.pop($('stamp'), t, rd, Infinity, -6);
  K.subtitles($('subs'), t);
  $('progress').style.width = (t / T.duration * 100) + '%';
}
window.seek = seek;
</script>
</body>
</html>
