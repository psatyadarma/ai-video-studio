<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Style test — Rangkumin Dong</title>
<link rel="stylesheet" href="../../styles/sticker/sticker.css">
<script src="../../styles/sticker/sticker.js"></script>
<script src="build/timing.js"></script>
<style>
  .bar { position: absolute; bottom: 0; width: 170px; border-radius: 22px 22px 8px 8px; background: var(--slate); transform: none; }
  .bar.acc { background: var(--accent); }
  .val { font-weight: 900; font-size: 54px; letter-spacing: -1.5px; white-space: nowrap; }
  .yr { font-weight: 800; font-size: 40px; color: var(--slate); }
  .vs { font-weight: 900; font-size: 90px; color: var(--accent); }
  .team { width: 400px; height: 300px; border-radius: 34px; background: #fff; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 18px; font-weight: 900; font-size: 50px; text-align: center; line-height: 1.05; }
  #endcard { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 34px; background: var(--paper); }
  #endcard .logo { background: var(--accent); color: #fff; font-weight: 900; font-size: 116px; letter-spacing: -4px;
                   padding: 30px 58px 40px; border-radius: 44px; line-height: .95; text-align: center; transform: rotate(-3deg); }
  #endcard .tl { font-weight: 800; font-size: 54px; color: var(--slate); }
  #endcard .h { font-weight: 900; font-size: 50px; background: var(--ink); color: #fff; padding: 12px 26px; border-radius: 16px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <!-- HOOK -->
    <div id="headline" class="abs headline" style="left:540px; top:620px; width:820px; font-size:96px;"></div>
    <div id="cup" class="abs sticker-svg" style="left:540px; top:1040px;">
      <svg width="420" height="520" viewBox="0 0 420 520">
        <path d="M150 60 q-25 -30 0 -55 M210 60 q-25 -30 0 -55 M270 60 q-25 -30 0 -55" stroke="#C9C2B3" stroke-width="12" fill="none" stroke-linecap="round"/>
        <rect x="70" y="80" width="280" height="44" rx="16" fill="#1B2430"/>
        <path d="M84 124 L336 124 L306 500 Q304 512 292 512 L128 512 Q116 512 114 500 Z" fill="#EADFCB"/>
        <path d="M96 270 L324 270 L318 360 L102 360 Z" fill="#FF5A36"/>
        <text x="210" y="330" text-anchor="middle" font-family="Inter Display, Inter" font-weight="900" font-size="54" fill="#fff">KOPI</text>
        <path d="M110 380 L310 380 L306 440 Q250 470 210 450 Q170 430 114 450 Z" fill="#B98B5B" opacity=".55"/>
      </svg>
    </div>
    <div id="stamp" class="abs stamp sticker" style="left:540px; top:860px; font-size:92px;">Rangkumin dong!</div>

    <!-- PARTS (labels around the cup) -->
    <svg id="leaders" class="abs" style="left:540px; top:960px;" width="1080" height="1100" viewBox="0 0 1080 1100">
      <g stroke="#1B2430" stroke-width="6" stroke-linecap="round" fill="none">
        <path id="ld0" d="M330 260 L210 200"/>
        <path id="ld1" d="M750 320 L880 250"/>
        <path id="ld2" d="M350 700 L190 760"/>
        <path id="ld3" d="M720 760 L820 840"/>
      </g>
    </svg>
    <div id="lb0" class="abs tag sticker" style="left:210px; top:600px;">Biji kopi</div>
    <div id="lb1" class="abs tag sticker" style="left:860px; top:660px;">Susu</div>
    <div id="lb2" class="abs tag sticker" style="left:190px; top:1170px;">Gula</div>
    <div id="lb3" class="abs tag accent sticker" style="left:820px; top:1250px;">Sewa tempat</div>

    <!-- PRICE CHART -->
    <div id="ctitle" class="abs tag light sticker" style="left:1700px; top:520px;">Harga 1 gelas</div>
    <div id="chart" class="abs" style="left:1700px; top:960px; width:720px; height:620px; transform:translate(-50%,-50%);">
      <div style="position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--ink); border-radius:3px"></div>
    </div>
    <div id="v0" class="abs val" style="left:1465px;">Rp0</div>
    <div id="v1" class="abs val" style="left:1700px;">Rp0</div>
    <div id="v2" class="abs val acc" style="left:1935px; color:var(--accent)">Rp0</div>
    <div id="y0" class="abs yr" style="left:1465px; top:1310px;">2023</div>
    <div id="y1" class="abs yr" style="left:1700px; top:1310px;">2024</div>
    <div id="y2" class="abs yr" style="left:1935px; top:1310px;">2026</div>

    <!-- ROUTE -->
    <svg id="route" class="abs" style="left:1700px; top:2500px;" width="900" height="700" viewBox="0 0 900 700">
      <path id="road" d="M170 220 C 380 180, 300 520, 520 470 S 700 520, 740 470" stroke="#3E5568" stroke-width="16"
            stroke-dasharray="10 26" stroke-linecap="round" fill="none"/>
    </svg>
    <div id="wh" class="abs sticker-svg" style="left:1400px; top:2300px;">
      <svg width="230" height="190" viewBox="0 0 230 190"><path d="M10 80 L115 15 L220 80 L220 180 L10 180 Z" fill="#3E5568"/>
      <rect x="70" y="100" width="90" height="80" fill="#F3EFE6"/><path d="M70 125 H160 M70 150 H160" stroke="#3E5568" stroke-width="8"/></svg>
    </div>
    <div id="shop" class="abs sticker-svg" style="left:2000px; top:2660px;">
      <svg width="240" height="210" viewBox="0 0 240 210"><rect x="20" y="70" width="200" height="130" fill="#fff" stroke="#1B2430" stroke-width="8"/>
      <path d="M10 70 L40 15 H200 L230 70 Z" fill="#FF5A36"/><rect x="90" y="120" width="60" height="80" fill="#1B2430"/></svg>
    </div>
    <div id="truck" class="abs sticker-svg" style="left:1400px; top:2300px;">
      <svg width="190" height="120" viewBox="0 0 190 120"><rect x="5" y="15" width="115" height="70" rx="10" fill="#FF5A36"/>
      <path d="M120 40 H160 L185 65 V85 H120 Z" fill="#1B2430"/><circle cx="40" cy="95" r="20" fill="#1B2430"/><circle cx="150" cy="95" r="20" fill="#1B2430"/></svg>
    </div>
    <div id="t0" class="abs tag sticker" style="left:1560px; top:2120px;">Ongkos kirim ↑</div>
    <div id="t1" class="abs tag accent sticker" style="left:1880px; top:2900px;">Sewa ↑</div>

    <!-- CTA -->
    <div id="teamA" class="abs team sticker" style="left:540px; top:2230px;"><span style="font-size:44px;color:var(--slate)">TIM</span>Kopi sachet</div>
    <div id="vs" class="abs vs" style="left:540px; top:2500px;">VS</div>
    <div id="teamB" class="abs team sticker" style="left:540px; top:2770px; background:var(--accent); color:#fff;"><span style="font-size:44px;opacity:.8">TIM</span>Kopi kekinian</div>
  </div>

  <div id="brand"><div class="dot"></div><b>Rangkumin Dong</b></div>
  <div id="demo">DATA CONTOH</div>
  <div id="subs"></div>
  <div id="endcard">
    <div class="logo">RANGKUMIN<br>DONG</div>
    <div class="tl">Berita ribet? Rangkumin dong.</div>
    <div class="h">@rangkumindong</div>
  </div>
  <div id="progress"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const T = window.TIMING;
window.DURATION = T.duration;
const hookWords = "Kenapa harga kopi susu makin mahal?".split(' ');
$('headline').innerHTML = hookWords.map((w, i) => `<span class="w${i >= 2 && i <= 3 ? ' acc' : ''}">${w}</span>`).join(' ');
const roadLen = $('road').getTotalLength();

function seek(t) {
  const at = K.at;
  // ---- camera
  K.camera($('world'), [
    { t: 0, x: 540, y: 1117, z: 1.2 },
    { t: at('parts', -0.1), x: 540, y: 1117, z: 1.2 },
    { t: at('price', -0.35), x: 1700, y: 1117, z: 1.2, dur: 0.9 },
    { t: at('route', -0.35), x: 1700, y: 2667, z: 1.2, dur: 0.9 },
    { t: at('cta', -0.35), x: 540, y: 2682, z: 1.1, dur: 0.9 },
  ], t);

  // ---- hook headline: each word pops as it is spoken
  const L = K.line('hook');
  $('headline').querySelectorAll('.w').forEach((el, i) => {
    const w = L.words[i] || L.words[L.words.length - 1];
    const s = t < w.start - 0.05 ? 1 : K.spring(t - w.start + 0.05, 260, 20);
    const out = K.clamp((t - at('parts', -0.1)) / 0.3);
    el.style.opacity = (t >= w.start - 0.05 ? 1 : 0.28) * (1 - out);
    el.style.transform = `translateY(${(1 - s) * 40 - out * 60}px) scale(${0.7 + 0.3 * s})`;
  });

  // ---- cup: small under headline, then centre stage for the breakdown
  const pc = K.easeInOut(K.prog(t, at('parts', -0.1), 0.7));
  const cs = 1;
  $('cup').style.opacity = 1;
  $('cup').style.top = K.lerp(1040, 960, pc) + 'px';
  $('cup').style.transform = `translate(-50%,-50%) scale(${(0.5 + 0.35 * cs) * K.lerp(1, 1.18, pc)}) rotate(${K.lerp(-4, 0, pc)}deg)`;

  // ---- stamp "Rangkumin dong!"
  K.pop($('stamp'), t, at('rd', -0.05), at('parts', 0.2), -6);

  // ---- part labels on their spoken words
  const cues = [K.word('parts', 'biji'), K.word('parts', 'susu'), K.word('parts', 'gula'), K.word('parts', 'sewa')];
  cues.forEach((c, i) => {
    K.pop($('lb' + i), t, c - 0.05, at('price', -0.2), [-4, 3, 3, -3][i]);
    const p = $('ld' + i), len = 220;
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len * (1 - K.easeOut(K.prog(t, c - 0.1, 0.35)));
    p.style.opacity = t < at('price', -0.2) ? 1 : 0;
  });

  // ---- price chart: bars grow, numbers count up
  K.pop($('ctitle'), t, at('price', 0.1), Infinity, -2);
  const vals = [18000, 25000, 32000], H = 560, max = 32000;
  const bt = [at('price', 0.35), (at('price', 0.35) + K.word('price', 'jadi')) / 2, K.word('price', 'jadi')];
  const bars = $('chart');
  if (!bars.dataset.made) {
    bars.dataset.made = 1;
    [0, 1, 2].forEach((i) => { const b = document.createElement('div'); b.className = 'bar' + (i === 2 ? ' acc' : ''); b.id = 'bar' + i;
      b.style.left = (80 + i * 235) + 'px'; bars.appendChild(b); });
  }
  vals.forEach((v, i) => {
    const g = K.spring(t - bt[i] + 0.1, 120, 17);
    const h = H * (v / max) * g;
    $('bar' + i).style.height = Math.max(0, h) + 'px';
    const ve = $('v' + i);
    ve.textContent = K.rupiah(g > 0.97 ? v : Math.round(v * K.clamp(g) / 500) * 500);
    ve.style.top = (1270 - Math.max(0, h) - 50) + 'px';
    ve.style.opacity = t > bt[i] - 0.1 ? 1 : 0;
    $('y' + i).style.opacity = t > at('price', 0.1) ? 1 : 0;
  });

  // ---- route: road draws, truck drives, cost tags pop
  const rp = K.easeInOut(K.prog(t, at('route', 0.0), 1.8));
  $('road').style.strokeDashoffset = 0;
  $('road').setAttribute('stroke-dasharray', `${roadLen * rp} ${roadLen}`);
  K.pop($('wh'), t, at('route', -0.2), Infinity, -3);
  K.pop($('shop'), t, at('route', 0.6), Infinity, 3);
  const pt = $('road').getPointAtLength(roadLen * rp);
  $('truck').style.left = (1700 - 450 + pt.x) + 'px';
  $('truck').style.top = (2500 - 350 + pt.y - 40) + 'px';
  $('truck').style.opacity = t > at('route', 0) ? 1 : 0;
  K.pop($('t0'), t, K.word('route', 'ongkos'), Infinity, -3);
  K.pop($('t1'), t, K.word('route', 'sewa'), Infinity, 3);

  // ---- CTA: team cards
  K.pop($('teamA'), t, K.word('cta', 'tim'), Infinity, -3);
  K.pop($('vs'), t, K.word('cta', 'atau'), Infinity, 0);
  K.pop($('teamB'), t, K.word('cta', 'tim', 1), Infinity, 3);

  // ---- end card
  const ep = K.prog(t, at('end', -0.15), 0.3);
  $('endcard').style.opacity = ep;
  $('endcard').querySelector('.logo').style.transform = `rotate(-3deg) scale(${0.6 + 0.4 * K.spring(t - at('end', -0.15))})`;

  K.subtitles($('subs'), t);
  $('subs').style.visibility = ep > 0.5 ? 'hidden' : 'visible';
  $('progress').style.width = (100 * t / window.DURATION) + '%';
  return true;
}
window.seek = seek;
seek(0);
</script>
</body>
</html>
